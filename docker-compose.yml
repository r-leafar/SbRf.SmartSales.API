services:           
    sbrf-webapi:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: sbrf-webapi
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ASPNETCORE_HTTP_PORTS=8081
            - Database__ConnectionString=Host=${POSTGRES_SERVER};Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
            - Logger__URI=http://alloy:4317
        ports:
            - "8081:8081"
        networks:
            - app-network
        depends_on:
            - postgres  
            - loki
    tempo:
        container_name: tempo
        image: grafana/tempo:latest
        command: ["-config.file=/etc/tempo/tempo.yml"]
        volumes:
          - ./tempo.yml:/etc/tempo/tempo.yml
        ports:
          - "3200:3200"   # UI / query         
        networks:
          - app-network

    alloy:
        container_name: alloy
        image: grafana/alloy:v1.13.1
        environment:
            - POSTGRES_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-server:${POSTGRES_PORT}/postgres?sslmode=disable
        ports:
             - "4317:4317"  # OTLP gRPC
             - "4318:4318"  # OTLP HTTP
             - "12345:12345"
        volumes:
         - "./alloy:/etc/alloy"
        command: [
          "run",
          "--server.http.listen-addr=0.0.0.0:12345",
          "--stability.level=experimental",
          "/etc/alloy/config.alloy",
        ]
        networks:
        - app-network
  
    loki:
        container_name: loki
        image: grafana/loki:3.5.10
        ports:
          - "3100:3100"
        volumes:
          - ./loki-config.yml:/etc/loki/local-config.yaml
        command: -config.file=/etc/loki/local-config.yaml
        networks:
            - app-network
          
    prometheus:
        container_name: prometheus
        image: prom/prometheus:v3.5.1
        command:
          - --config.file=/etc/prometheus/prometheus.yml
          - --web.enable-remote-write-receiver
        volumes:
          - ./prometheus.yml:/etc/prometheus/prometheus.yml
        ports:
          - "9090:9090"
        networks:
            - app-network
    grafana:
        image: grafana/grafana
        container_name: grafana
        ports:
          - "3000:3000"
        environment:
          - GF_SECURITY_ADMIN_PASSWORD=admin
        depends_on:
          - prometheus
        networks:
            - app-network
    cadvisor:
        image: gcr.io/cadvisor/cadvisor:latest
        container_name: cadvisor
        restart: unless-stopped
        ports:
          - "8080:8080"
        volumes:
          - /:/rootfs:ro
          - /var/run:/var/run:ro
          - /sys:/sys:ro
          - /var/lib/docker/:/var/lib/docker:ro
          - /dev/disk/:/dev/disk:ro
        networks:
          - app-network
          
    postgres:
        container_name: postgres-server
        command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - 5432:5432
        volumes:
            - postgres-data:/var/lib/postgresql/18/docker
        image: postgres:18.1
        networks:
            - app-network
volumes:
    postgres-data:
        driver: local

networks:
    app-network:
        driver: bridge